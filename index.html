<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Loyiham</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 30px;
        }
        .card h2 {
            margin-bottom: 15px;
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 8px;
            overflow: hidden;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            border: none;
        }
        .buttons-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .btn-form {
            background-color: #9b59b6;
        }
        .btn-form:hover {
            background-color: #8e44ad;
        }
        .btn-presentation {
            background-color: #e67e22;
        }
        .btn-presentation:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Mening Ishchi Sahifam</h1>
            <p>Barcha kerakli resurslar bir joyda</p>
        </header>

        <!-- Google Sheets (Sayt ichida ochiladi) -->
        <div class="card">
            <h2>Google Sheets Jadvali</h2>
            <div class="iframe-container">
                <iframe src="https://docs.google.com/spreadsheets/d/1a1GsbX5iOTiiY_vEAtpuSfHYVh0K-Ig3Lnm3B89osRc/edit?usp=sharing&widget=true&headers=false"></iframe>
            </div>
        </div>

        <!-- YouTube Video (Sayt ichida ochiladi) -->
        <div class="card">
            <h2>YouTube Video</h2>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/PpGH1GCrMFg" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Boshqa havolalar uchun tugmalar -->
        <div class="card">
            <h2>Qo'shimcha Havolalar (Tugmalar)</h2>
            <div class="buttons-grid">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSe2xAHQc-r__3SqV7T4qmAwdYoCymUhUsoBC2ffQiz7CrnGqg/viewform?usp=header" target="_blank" class="btn btn-form">Google Formani O'qish/To'ldirish</a>
                <a href="https://docs.google.com/presentation/d/1FC7hRd1563FgdhAfgZL7MeKpVWiUVhHHFFwFZQ4Xn1U/edit?usp=sharing" target="_blank" class="btn btn-presentation">Prezidentlik Taqdimotini Ochish</a>
            </div>
        </div>
    </div>

</body>
</html>
